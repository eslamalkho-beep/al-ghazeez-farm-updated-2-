<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سجل القطيع | مزرعة الغزيز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <div class="app-shell">
    <div id="sidebar-container"></div>

    <div class="main-area">
      <div id="header-container"></div>

      <main class="page-content">
        <div class="page-header">
          <h2>سجل القطيع</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <a href="births.html" class="btn btn--outline">سجل الولادات</a>
            <a href="deaths.html" class="btn btn--outline">سجل النفوق</a>
            <a href="health.html" class="btn btn--outline">السجل الصحي</a>
            <a href="weights.html" class="btn btn--outline">سجل الوزن</a>
            <a href="vaccinations.html" class="btn btn--outline">التحصينات</a>
            <a href="locations.html" class="btn btn--outline">الحظائر والمواقع</a>
            <button type="button" class="btn btn--outline" id="export-excel-btn">تصدير Excel</button>
            <button type="button" class="btn btn--outline" id="export-pdf-btn">تصدير PDF</button>
            <a href="herd-form.html" class="btn btn--success">+ تكويد حيوان جديد</a>
          </div>
        </div>

        <div class="card" style="margin-bottom: var(--spacing-3);">
          <div style="display:flex; gap: var(--spacing-3); flex-wrap: wrap;">
            <select id="filter-type" class="form-control" style="max-width:160px;">
              <option value="">كل الأنواع</option>
              <option value="sheep">غنم</option>
              <option value="goat">ماعز</option>
            </select>
            <select id="filter-status" class="form-control" style="max-width:180px;">
              <option value="">كل الحالات</option>
              <option value="alive">حي (كل الحالات الصحية)</option>
              <option value="healthy">سليم</option>
              <option value="sick">مريض</option>
              <option value="underTreatment">تحت العلاج</option>
              <option value="quarantine">حجر صحي</option>
              <option value="dead">نافق</option>
              <option value="sold">مباع</option>
              <option value="movedToTrade">تحويل لمخزون التجارة</option>
            </select>
            <select id="filter-breed" class="form-control" style="max-width:180px;">
              <option value="">كل السلالات</option>
            </select>
            <select id="filter-gender" class="form-control" style="max-width:150px;">
              <option value="">كل الأجناس</option>
              <option value="male">ذكر</option>
              <option value="female">أنثى</option>
            </select>
          </div>
        </div>

        <div id="herd-table"></div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="../js/db/db.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/notification-service.js"></script>
  <script src="../js/services/animal-service.js"></script>
  <script src="../js/services/death-service.js"></script>
  <script src="../js/services/revenue-service.js"></script>
  <script src="../js/services/location-service.js"></script>
  <script src="../js/services/transfer-service.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="../js/components/export-utils.js"></script>
  <script src="../js/pages/herd-list-page.js"></script>
</body>
</html>
