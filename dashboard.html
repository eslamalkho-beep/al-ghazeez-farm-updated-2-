<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم | مزرعة الغزيز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <div class="app-shell">
    <div id="sidebar-container"></div>

    <div class="main-area">
      <div id="header-container"></div>

      <main class="page-content">
        <div class="kpi-grid" id="kpi-grid"></div>

        <div class="dashboard-charts">
          <div class="card">
            <div class="card__header"><h3>الإيرادات مقابل المصروفات</h3></div>
            <div class="chart-box"><canvas id="revenue-expense-chart"></canvas></div>
          </div>
          <div class="card">
            <div class="card__header"><h3>توزيع القطيع حسب النوع</h3></div>
            <div class="chart-box"><canvas id="herd-type-chart"></canvas></div>
          </div>
        </div>

        <div class="dashboard-charts">
          <div class="card">
            <div class="card__header"><h3>المواليد مقابل النفوق (آخر 6 أشهر)</h3></div>
            <div class="chart-box"><canvas id="births-deaths-chart"></canvas></div>
          </div>
          <div class="card">
            <div class="card__header"><h3>تنبيهات سريعة</h3></div>
            <div id="quick-alerts"></div>
          </div>
        </div>

        <div class="dashboard-charts dashboard-charts--equal">
          <div class="card">
            <div class="card__header"><h3>توزيع القطيع حسب الجنس</h3></div>
            <div class="chart-box"><canvas id="herd-gender-chart"></canvas></div>
          </div>
          <div class="card">
            <div class="card__header"><h3>توزيع القطيع حسب الحالة الصحية</h3></div>
            <div class="chart-box"><canvas id="herd-health-chart"></canvas></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <script src="js/db/db.js"></script>
  <script src="js/services/auth-service.js"></script>
  <script src="js/services/notification-service.js"></script>
  <script src="js/services/animal-service.js"></script>
  <script src="js/services/birth-service.js"></script>
  <script src="js/services/death-service.js"></script>
  <script src="js/services/expense-service.js"></script>
  <script src="js/services/revenue-service.js"></script>
  <script src="js/services/purchase-service.js"></script>
  <script src="js/services/bulk-batch-service.js"></script>
  <script src="js/services/inventory-service.js"></script>
  <script src="js/utils/formatters.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/chart-renderer.js"></script>
  <script src="js/pages/dashboard-page.js"></script>
</body>
</html>
