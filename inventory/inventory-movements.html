<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حركات المخزون | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .report-tabs { display:flex; gap:8px; margin-bottom: var(--spacing-3); flex-wrap:wrap; }
    .report-tab { padding:9px 16px; border-radius:999px; background:var(--color-surface); border:1px solid var(--color-border); font-size:13px; font-weight:700; color:var(--color-text-secondary); }
    .report-tab.active { background: var(--color-primary-blue); color:#fff; border-color: var(--color-primary-blue); }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>حركات المخزون</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn btn--outline" id="export-excel-btn">تصدير Excel</button>
            <button type="button" class="btn btn--outline" id="export-pdf-btn">تصدير PDF</button>
          </div>
        </div>
        <p style="color: var(--color-text-secondary); font-size: 13px; margin-top: calc(-1 * var(--spacing-2)); margin-bottom: var(--spacing-3);">
          حركات "وارد" (شراء) و"صادر" (استهلاك/تالف) تُسجَّل تلقائيًا من صفحتي المشتريات والمصروفات — عدّلها من هناك. هذا السجل للعرض والتتبع، وتعديل/حذف يدوي متاح فقط للحركات الأخرى غير المرتبطة بمصروف/مشترى (تسوية جرد، عهدة، ...).
        </p>

        <div id="inventory-movement-table"></div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="../js/db/db.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/inventory-service.js"></script>
  <script src="../js/services/fattening-service.js"></script>
  <script src="../js/services/expense-service.js"></script>
  <script src="../js/services/purchase-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="../js/components/export-utils.js"></script>
  <script src="../js/pages/inventory-movement-list-page.js"></script>
</body>
</html>
