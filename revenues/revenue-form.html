<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تكويد إيراد | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2 id="form-title">تكويد إيراد جديد</h2>
          <a href="revenue-list.html" class="btn btn--outline">→ العودة للسجل</a>
        </div>
        <div class="card">
          <form id="revenue-form" class="form-grid" novalidate>
            <div class="form-group">
              <label for="category">نوع الإيراد <span class="required">*</span></label>
              <select id="category" class="form-control"></select>
            </div>
            <div class="form-group" id="animal-field-group" style="display:none;">
              <label for="animalId">كود الحيوان المباع <span class="required">*</span></label>
              <select id="animalId" class="form-control"></select>
              <span class="form-error">يرجى اختيار الحيوان</span>
            </div>
            <div class="form-group">
              <label for="amount">المبلغ <span class="required">*</span></label>
              <input type="number" id="amount" class="form-control" min="0" step="0.01" />
              <span class="form-error">أدخل مبلغًا صحيحًا</span>
            </div>
            <div class="form-group">
              <label for="date">التاريخ <span class="required">*</span></label>
              <input type="date" id="date" class="form-control" />
              <span class="form-error">التاريخ مطلوب</span>
            </div>
            <div class="form-group">
              <label for="hasTaxInvoice">فاتورة ضريبية؟</label>
              <select id="hasTaxInvoice" class="form-control">
                <option value="no">لا</option>
                <option value="yes">نعم</option>
              </select>
            </div>
            <div class="form-group form-group--full" id="tax-breakdown-group" style="display:none;">
              <label>تفاصيل الضريبة (15%)</label>
              <div class="tax-breakdown-box">
                <span>المبلغ قبل الضريبة: <strong id="tax-before-label">-</strong></span>
                <span>قيمة الضريبة: <strong id="tax-value-label">-</strong></span>
              </div>
            </div>
            <div class="form-group">
              <label for="receiveMethod">طريقة الاستلام</label>
              <select id="receiveMethod" class="form-control">
                <option value="cash">نقدي</option>
                <option value="transfer">تحويل بنكي</option>
              </select>
            </div>
            <div class="form-group">
              <label for="partyId">العميل</label>
              <select id="partyId" class="form-control"></select>
            </div>
            <div class="form-group form-group--full" id="client-manual-group">
              <label for="client">أو أدخل اسم عميل/جهة غير مسجّلة</label>
              <input type="text" id="client" class="form-control" placeholder="اسم حر (اختياري)" />
            </div>
            <div class="form-group form-group--full">
              <label for="notes">ملاحظات</label>
              <textarea id="notes" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--success" id="save-btn">حفظ</button>
              <a href="revenue-list.html" class="btn btn--outline">إلغاء</a>
              <button type="button" class="btn btn--danger" id="delete-btn" style="display:none; margin-right:auto;">حذف</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/notification-service.js"></script>
  <script src="../js/services/animal-service.js"></script>
  <script src="../js/services/revenue-service.js"></script>
  <script src="../js/services/category-service.js"></script>
  <script src="../js/services/party-service.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/pages/revenue-form-page.js"></script>
</body>
</html>
