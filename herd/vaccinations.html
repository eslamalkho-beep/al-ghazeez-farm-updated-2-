<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سجل التحصينات | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2 id="page-title">سجل التحصينات</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn btn--outline" id="export-excel-btn">تصدير Excel</button>
            <button type="button" class="btn btn--outline" id="export-pdf-btn">تصدير PDF</button>
            <a href="herd-list.html" class="btn btn--outline">→ سجل القطيع</a>
          </div>
        </div>

        <div class="card" id="vaccination-form-card" style="margin-bottom: var(--spacing-4);">
          <div class="card__header"><h3>تسجيل تحصين جديد</h3></div>

          <form id="vaccination-form" class="form-grid" novalidate>
            <div class="form-group">
              <label for="animalId">الحيوان <span class="required">*</span></label>
              <select id="animalId" class="form-control"></select>
              <span class="form-error">يرجى اختيار الحيوان</span>
            </div>

            <div class="form-group">
              <label for="vaccineName">نوع اللقاح <span class="required">*</span></label>
              <input type="text" id="vaccineName" class="form-control" placeholder="مثال: حمى الوادي المتصدع، الجدري..." />
              <span class="form-error">نوع اللقاح مطلوب</span>
            </div>

            <div class="form-group">
              <label for="date">تاريخ الجرعة <span class="required">*</span></label>
              <input type="date" id="date" class="form-control" />
              <span class="form-error">التاريخ مطلوب</span>
            </div>

            <div class="form-group">
              <label for="nextDueDate">تاريخ الجرعة القادمة (إن وُجدت)</label>
              <input type="date" id="nextDueDate" class="form-control" />
            </div>

            <div class="form-group form-group--full">
              <label for="notes">ملاحظات</label>
              <input type="text" id="notes" class="form-control" />
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--success" id="save-vaccination-btn">حفظ التحصين</button>
            </div>
          </form>
        </div>

        <div class="card__header" style="padding: 0 4px; display:flex; justify-content:space-between; align-items:center;">
          <h3 id="table-title">سجل التحصينات الكامل</h3>
          <a href="vaccinations.html" id="clear-animal-filter-link" style="display:none; font-size:13px;">عرض كل الحيوانات</a>
        </div>
        <div id="vaccination-table"></div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="../js/db/db.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/notification-service.js"></script>
  <script src="../js/services/animal-service.js"></script>
  <script src="../js/services/vaccination-service.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="../js/components/export-utils.js"></script>
  <script src="../js/pages/vaccinations-page.js"></script>
</body>
</html>
