<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سجل الأصول الثابتة | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>سجل الأصول الثابتة</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <a href="assets-hub.html" class="btn btn--outline">→ العودة للمدخل</a>
            <button type="button" class="btn btn--outline" id="export-excel-btn">تصدير Excel</button>
            <button type="button" class="btn btn--outline" id="export-pdf-btn">تصدير PDF</button>
            <a href="asset-form.html" class="btn btn--success" id="add-asset-btn">+ إضافة أصل</a>
          </div>
        </div>

        <div class="card" style="margin-bottom: var(--spacing-3);">
          <div style="display:flex; gap: var(--spacing-3); flex-wrap: wrap;">
            <select id="filter-type" class="form-control" style="max-width:180px;">
              <option value="">كل الأنواع</option>
            </select>
          </div>
        </div>

        <div id="asset-table"></div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="../js/db/db.js"></script>
<script src="../js/services/account-mapping-service.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/fixed-asset-service.js"></script>
  <script src="../js/services/location-service.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="../js/components/export-utils.js"></script>
  <script src="../js/pages/asset-list-page.js"></script>
</body>
</html>
