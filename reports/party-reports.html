<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقارير العملاء والموردين | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    @media print { .sidebar, .app-header, .report-filters, #print-btn { display:none !important; } .main-area { margin:0 !important; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>تقارير العملاء والموردين</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn btn--outline" id="export-excel-btn">تصدير Excel</button>
            <button type="button" class="btn btn--outline" id="export-pdf-btn">تصدير PDF</button>
            <button class="btn btn--outline" id="print-btn" onclick="window.print()">🖨 طباعة</button>
          </div>
        </div>
        <div class="report-tabs">
          <a href="herd-reports.html" class="report-tab">تقارير القطيع</a>
          <a href="health-reports.html" class="report-tab">تقارير السجل الصحي</a>
          <a href="revenue-reports.html" class="report-tab">تقارير الإيرادات</a>
          <a href="sales-report.html" class="report-tab">المبيعات وتكلفة الرأس</a>
          <a href="expense-reports.html" class="report-tab">تقارير المصروفات</a>
          <a href="purchase-reports.html" class="report-tab">تقارير المشتريات</a>
          <span class="report-tab active">العملاء والموردون</span>
          <a href="inventory-reports.html" class="report-tab">المخزون</a>
          <a href="accounting-reports.html" class="report-tab">المحاسبة</a>
          <a href="overview-report.html" class="report-tab">التقرير الشامل</a>
        </div>

        <div class="report-tabs">
          <button type="button" class="report-tab active" id="mode-single-btn" data-mode="single">سجل عميل/مورّد واحد</button>
          <button type="button" class="report-tab" id="mode-top-btn" data-mode="top">أعلى العملاء/الموردين</button>
        </div>

        <div class="report-filters" id="single-filters">
          <label style="font-size:13px; color:var(--color-text-secondary);">النوع</label>
          <select id="single-type" class="form-control" style="max-width:140px;">
            <option value="client">عميل</option>
            <option value="supplier">مورّد</option>
          </select>
          <label style="font-size:13px; color:var(--color-text-secondary);">الاسم</label>
          <select id="single-party" class="form-control" style="max-width:220px;"></select>
          <label style="font-size:13px; color:var(--color-text-secondary);">من</label>
          <input type="date" id="single-from" class="form-control" style="max-width:150px;" />
          <label style="font-size:13px; color:var(--color-text-secondary);">إلى</label>
          <input type="date" id="single-to" class="form-control" style="max-width:150px;" />
        </div>

        <div class="report-filters" id="top-filters" style="display:none;">
          <label style="font-size:13px; color:var(--color-text-secondary);">النوع</label>
          <select id="top-type" class="form-control" style="max-width:140px;">
            <option value="client">أعلى العملاء (شراءً منّا)</option>
            <option value="supplier">أعلى الموردين (بيعًا لنا)</option>
          </select>
          <label style="font-size:13px; color:var(--color-text-secondary);">من</label>
          <input type="date" id="top-from" class="form-control" style="max-width:150px;" />
          <label style="font-size:13px; color:var(--color-text-secondary);">إلى</label>
          <input type="date" id="top-to" class="form-control" style="max-width:150px;" />
          <label style="font-size:13px; color:var(--color-text-secondary);">عدد النتائج</label>
          <input type="number" id="top-n" class="form-control" style="max-width:90px;" min="1" step="1" value="10" />
        </div>

        <div id="report-content"></div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="../js/db/db.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/notification-service.js"></script>
  <script src="../js/services/revenue-service.js"></script>
  <script src="../js/services/purchase-service.js"></script>
  <script src="../js/services/bulk-batch-service.js"></script>
  <script src="../js/services/party-service.js"></script>
  <script src="../js/services/animal-service.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="../js/components/chart-renderer.js"></script>
  <script src="../js/components/export-utils.js"></script>
  <script src="../js/components/kpi-bar.js"></script>
  <script src="../js/pages/party-reports-page.js"></script>
</body>
</html>
