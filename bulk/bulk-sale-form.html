<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل عملية بيع جملة | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .batch-section { margin-bottom: var(--spacing-4); }
    .batch-line-block { margin-bottom: 8px; }
    .batch-line-row {
      display: grid;
      gap: var(--spacing-2);
      align-items: end;
      padding: 10px 12px;
      background: var(--color-bg);
      border-radius: var(--radius-sm);
    }
    .batch-line-row--sale { grid-template-columns: 1.2fr 1fr 1fr 1.3fr 0.8fr 1fr 1fr 36px; }
    .batch-line-field label { display:block; font-size:11.5px; font-weight:700; color: var(--color-text-secondary); margin-bottom:4px; }
    .batch-line-total { font-weight:700; font-size:13.5px; color: var(--color-primary-green-dark); padding-bottom: 9px; }
    .batch-line-hint { font-size:11.5px; color: var(--color-text-secondary); padding: 5px 12px 0; }
    .batch-line-hint strong { color: var(--color-text-primary); }
    .batch-line-remove-btn {
      width:32px; height:32px; border-radius: var(--radius-sm);
      border:1px solid var(--color-border); background: var(--color-surface);
      color: var(--color-primary-red); font-weight:800; cursor:pointer;
    }
    .batch-summary-box {
      display:grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacing-3);
      background: var(--color-bg); border-radius: var(--radius-sm); padding: var(--spacing-3);
      margin-bottom: var(--spacing-4);
    }
    .batch-summary-item { text-align:center; }
    .batch-summary-item__label { font-size:12px; color: var(--color-text-secondary); font-weight:700; margin-bottom:4px; }
    .batch-summary-item__value { font-size:16px; font-weight:800; }
    @media (max-width: 900px) {
      .batch-line-row--sale { grid-template-columns: 1fr 1fr; }
      .batch-summary-box { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2 id="form-title">تسجيل عملية بيع جديدة</h2>
          <a href="bulk-sales.html" class="btn btn--outline">→ العودة للمبيعات</a>
        </div>

        <div class="card">
          <form id="sale-form" class="form-grid" novalidate>
            <div class="form-group">
              <label>كود العملية</label>
              <input type="text" id="code" class="form-control" readonly />
            </div>
            <div class="form-group">
              <label for="date">تاريخ البيع <span class="required">*</span></label>
              <input type="date" id="date" class="form-control" />
              <span class="form-error">التاريخ مطلوب</span>
            </div>
            <div class="form-group form-group--full">
              <label for="notes">ملاحظات</label>
              <input type="text" id="notes" class="form-control" />
            </div>
          </form>

          <div class="batch-summary-box">
            <div class="batch-summary-item">
              <div class="batch-summary-item__label">إجمالي العدد</div>
              <div class="batch-summary-item__value" id="summary-count">0</div>
            </div>
            <div class="batch-summary-item">
              <div class="batch-summary-item__label">إيراد البيع</div>
              <div class="batch-summary-item__value" id="summary-revenue">0</div>
            </div>
            <div class="batch-summary-item">
              <div class="batch-summary-item__label">تكلفة البضاعة المباعة</div>
              <div class="batch-summary-item__value" id="summary-cogs">0</div>
            </div>
            <div class="batch-summary-item">
              <div class="batch-summary-item__label">إجمالي الربح</div>
              <div class="batch-summary-item__value" id="summary-profit">0</div>
            </div>
          </div>

          <div class="batch-section">
            <div class="card__header"><h3>بنود البيع</h3></div>
            <div id="sale-lines-list"></div>
            <button type="button" class="btn btn--outline btn--sm" id="add-sale-line-btn">+ إضافة بند بيع</button>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn--success" id="save-btn">حفظ</button>
            <a href="bulk-sales.html" class="btn btn--outline">إلغاء</a>
            <button type="button" class="btn btn--danger" id="delete-btn" style="display:none; margin-right:auto;">حذف العملية</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
<script src="../js/services/account-mapping-service.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/animal-service.js"></script>
  <script src="../js/services/bulk-batch-service.js"></script>
  <script src="../js/services/party-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/pages/bulk-sale-form-page.js"></script>
</body>
</html>
