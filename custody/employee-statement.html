<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كشف حساب موظف | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>كشف حساب العهد لموظف</h2>
          <a href="custody-hub.html" class="btn btn--outline">→ العودة</a>
        </div>

        <div class="card" style="margin-bottom: var(--spacing-4);">
          <div class="form-grid">
            <div class="form-group">
              <label for="f-employeeId">الموظف</label>
              <select id="f-employeeId" class="form-control"></select>
            </div>
            <div class="form-group">
              <label for="f-from">من تاريخ</label>
              <input type="date" id="f-from" class="form-control" />
            </div>
            <div class="form-group">
              <label for="f-to">إلى تاريخ</label>
              <input type="date" id="f-to" class="form-control" />
            </div>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top: var(--spacing-3);">
            <button type="button" class="btn btn--outline" id="print-btn">طباعة</button>
            <button type="button" class="btn btn--outline" id="export-excel-btn">تصدير Excel</button>
            <button type="button" class="btn btn--outline" id="export-pdf-btn">تصدير PDF</button>
          </div>
        </div>

        <div class="kpi-grid" id="statement-kpis"></div>
        <div id="statement-table"></div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
<script src="../js/services/account-mapping-service.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/services/inventory-service.js"></script>
  <script src="../js/services/custody-service.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="../js/components/kpi-bar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="../js/components/export-utils.js"></script>
  <script src="../js/pages/employee-statement-page.js"></script>
</body>
</html>
