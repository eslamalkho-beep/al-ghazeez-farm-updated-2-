<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جرد الأصول الثابتة | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>🔍 جرد الأصول الثابتة</h2>
          <a href="assets-hub.html" class="btn btn--outline">→ العودة للمدخل</a>
        </div>

        <div class="card" style="margin-bottom: var(--spacing-4);">
          <div class="card__header"><h3>جلسة جرد جديدة</h3></div>
          <form id="count-form">
            <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; padding: 0 var(--spacing-3);">
              <div class="form-group" style="margin:0;">
                <label for="date">تاريخ الجرد <span class="required">*</span></label>
                <input type="date" id="date" class="form-control" style="max-width:200px;" />
              </div>
              <div class="form-group" style="margin:0; flex:1; min-width:220px;">
                <label for="session-notes">ملاحظات عامة</label>
                <input type="text" id="session-notes" class="form-control" placeholder="اختياري" />
              </div>
            </div>
            <div id="count-lines-table" style="padding: var(--spacing-3);"></div>
            <div class="form-actions" style="padding: 0 var(--spacing-3) var(--spacing-3);">
              <button type="submit" class="btn btn--success" id="save-btn">حفظ الجرد</button>
            </div>
          </form>
        </div>

        <div class="card">
          <div class="card__header"><h3>سجل جلسات الجرد السابقة</h3></div>
          <div id="count-history-table"></div>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
<script src="../js/services/account-mapping-service.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/services/fixed-asset-service.js"></script>
  <script src="../js/services/location-service.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="../js/pages/asset-count-page.js"></script>
</body>
</html>
