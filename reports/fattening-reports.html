<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقرير التسمين | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    @media print { .sidebar, .app-header, .report-filters, #print-btn { display:none !important; } .main-area { margin:0 !important; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>تقرير التسمين</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn btn--outline" id="export-excel-btn">تصدير Excel</button>
            <button type="button" class="btn btn--outline" id="export-pdf-btn">تصدير PDF</button>
            <button class="btn btn--outline" id="print-btn" onclick="window.print()">🖨 طباعة</button>
          </div>
        </div>

        <div class="report-filters">
          <label style="font-size:13px; color:var(--color-text-secondary);">الدفعة</label>
          <select id="batch-filter" class="form-control" style="max-width:260px;">
            <option value="">كل الدفعات</option>
          </select>
          <label style="font-size:13px; color:var(--color-text-secondary);">الحالة</label>
          <select id="status-filter" class="form-control" style="max-width:150px;">
            <option value="">الكل</option>
            <option value="active">نشطة</option>
            <option value="closed">مغلقة</option>
          </select>
        </div>

        <div id="report-content"></div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="../js/db/db.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/animal-service.js"></script>
  <script src="../js/services/weight-service.js"></script>
  <script src="../js/services/health-service.js"></script>
  <script src="../js/services/expense-service.js"></script>
  <script src="../js/services/revenue-service.js"></script>
  <script src="../js/services/death-service.js"></script>
  <script src="../js/services/location-service.js"></script>
  <script src="../js/services/inventory-service.js"></script>
  <script src="../js/services/fattening-service.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="../js/components/export-utils.js"></script>
  <script src="../js/components/kpi-bar.js"></script>
  <script src="../js/pages/fattening-reports-page.js"></script>
</body>
</html>
