<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قيد يومية | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .batch-section { margin-bottom: var(--spacing-4); }
    .batch-line-row {
      display: grid;
      gap: var(--spacing-2);
      align-items: end;
      padding: 10px 12px;
      background: var(--color-bg);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }
    .batch-line-row--je { grid-template-columns: 2fr 1fr 1fr 1.3fr 36px; }
    .batch-line-field label { display:block; font-size:11.5px; font-weight:700; color: var(--color-text-secondary); margin-bottom:4px; }
    .batch-line-remove-btn {
      width:32px; height:32px; border-radius: var(--radius-sm);
      border:1px solid var(--color-border); background: var(--color-surface);
      color: var(--color-primary-red); font-weight:800; cursor:pointer;
    }
    .batch-summary-box {
      display:grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-3);
      background: var(--color-bg); border-radius: var(--radius-sm); padding: var(--spacing-3);
      margin-bottom: var(--spacing-4);
    }
    .batch-summary-item { text-align:center; }
    .batch-summary-item__label { font-size:12px; color: var(--color-text-secondary); font-weight:700; margin-bottom:4px; }
    .batch-summary-item__value { font-size:16px; font-weight:800; }
    @media (max-width: 900px) {
      .batch-line-row--je { grid-template-columns: 1fr 1fr; }
      .batch-summary-box { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2 id="form-title">قيد يومية جديد</h2>
          <a href="journal-entries.html" class="btn btn--outline">→ العودة للقيود</a>
        </div>

        <div class="card">
          <form id="entry-form" class="form-grid" novalidate onsubmit="return false;">
            <div class="form-group">
              <label>رقم القيد</label>
              <input type="text" id="entryNumber" class="form-control" readonly />
            </div>
            <div class="form-group">
              <label for="date">التاريخ <span class="required">*</span></label>
              <input type="date" id="date" class="form-control" />
              <span class="form-error">التاريخ مطلوب</span>
            </div>
            <div class="form-group form-group--full">
              <label for="description">وصف القيد <span class="required">*</span></label>
              <input type="text" id="description" class="form-control" placeholder="مثال: شراء أعلاف نقدًا" />
              <span class="form-error">الوصف مطلوب</span>
            </div>
          </form>

          <div class="batch-summary-box">
            <div class="batch-summary-item">
              <div class="batch-summary-item__label">إجمالي المدين</div>
              <div class="batch-summary-item__value" id="summary-total-debit">0</div>
            </div>
            <div class="batch-summary-item">
              <div class="batch-summary-item__label">إجمالي الدائن</div>
              <div class="batch-summary-item__value" id="summary-total-credit">0</div>
            </div>
            <div class="batch-summary-item">
              <div class="batch-summary-item__label">الحالة</div>
              <div class="batch-summary-item__value" id="summary-balance-status">-</div>
            </div>
          </div>

          <div class="batch-section">
            <div class="card__header"><h3>سطور القيد</h3></div>
            <div id="lines-list"></div>
            <button type="button" class="btn btn--outline btn--sm" id="add-line-btn">+ إضافة سطر</button>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn--success" id="save-btn">حفظ</button>
            <a href="journal-entries.html" class="btn btn--outline">إلغاء</a>
            <button type="button" class="btn btn--danger" id="delete-btn" style="display:none; margin-right:auto;">حذف</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/notification-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/pages/journal-entry-form-page.js"></script>
</body>
</html>
