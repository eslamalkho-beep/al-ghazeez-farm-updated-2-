<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقارير القطيع | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    @media print {
      .sidebar, .app-header, .report-tabs, .report-filters, #print-btn { display:none !important; }
      .main-area { margin: 0 !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>تقارير القطيع</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn btn--outline" id="export-excel-btn">تصدير Excel</button>
            <button type="button" class="btn btn--outline" id="export-pdf-btn">تصدير PDF</button>
            <button class="btn btn--outline" id="print-btn" onclick="window.print()">🖨 طباعة</button>
          </div>
        </div>

        <div class="report-tabs">
          <button class="report-tab active" data-tab="stats">إحصائيات القطيع</button>
          <button class="report-tab" data-tab="births">المواليد خلال فترة</button>
          <button class="report-tab" data-tab="byMother">المواليد حسب الأم</button>
          <button class="report-tab" data-tab="deaths">النفوق خلال فترة</button>
          <button class="report-tab" data-tab="byType">حسب النوع</button>
          <button class="report-tab" data-tab="byBreed">حسب السلالة</button>
          <button class="report-tab" data-tab="mating">التلقيح خلال فترة</button>
          <button class="report-tab" data-tab="pregnancy">الحمل خلال فترة</button>
        </div>

        <div class="report-filters">
          <label style="font-size:13px; color:var(--color-text-secondary);">من</label>
          <input type="date" id="report-from" class="form-control" style="max-width:170px;" />
          <label style="font-size:13px; color:var(--color-text-secondary);">إلى</label>
          <input type="date" id="report-to" class="form-control" style="max-width:170px;" />
          <label id="report-animal-label" style="font-size:13px; color:var(--color-text-secondary); display:none;">الحيوان</label>
          <select id="report-animal-filter" class="form-control" style="max-width:220px; display:none;">
            <option value="">كل الإناث</option>
          </select>
        </div>

        <div id="report-content"></div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="../js/db/db.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/animal-service.js"></script>
  <script src="../js/services/birth-service.js"></script>
  <script src="../js/services/death-service.js"></script>
  <script src="../js/services/mating-service.js"></script>
  <script src="../js/services/pregnancy-service.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="../js/components/chart-renderer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="../js/components/export-utils.js"></script>
  <script src="../js/components/kpi-bar.js"></script>
  <script src="../js/pages/herd-reports-page.js"></script>
</body>
</html>
