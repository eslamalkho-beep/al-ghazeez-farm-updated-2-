<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الإعدادات | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>الإعدادات</h2>
        </div>

        <div class="dashboard-charts">
          <section class="card">
            <div class="card__header"><h3>بيانات المزرعة</h3></div>
            <form id="farm-settings-form" class="form-grid">
              <div class="form-group">
                <label for="farmName">اسم المزرعة</label>
                <input type="text" id="farmName" class="form-control" />
              </div>
              <div class="form-group">
                <label for="ownerName">اسم المالك</label>
                <input type="text" id="ownerName" class="form-control" />
              </div>
              <div class="form-group">
                <label for="farmPhone">رقم التواصل</label>
                <input type="text" id="farmPhone" class="form-control" />
              </div>
              <div class="form-group">
                <label for="farmLocation">الموقع</label>
                <input type="text" id="farmLocation" class="form-control" />
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn--success">حفظ الإعدادات</button>
              </div>
            </form>
          </section>

          <section class="card">
            <div class="card__header"><h3>إدارة البيانات</h3></div>
            <div style="display:flex; flex-direction:column; gap: var(--spacing-3);">
              <button type="button" class="btn btn--outline" id="export-data-btn">تصدير نسخة احتياطية</button>
              <label class="btn btn--outline" for="import-data-file" style="cursor:pointer;">استيراد نسخة احتياطية</label>
              <input type="file" id="import-data-file" accept="application/json" style="display:none;" />
              <button type="button" class="btn btn--danger" id="reset-data-btn">حذف البيانات وإعادة البداية</button>
            </div>
          </section>

          <section class="card" id="user-management-section" style="display:none; grid-column: 1 / -1;">
            <div class="card__header">
              <h3>إدارة المستخدمين والصلاحيات</h3>
              <button type="button" class="btn btn--primary" id="add-user-btn">إضافة مستخدم</button>
            </div>
            <div id="users-table"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/notification-service.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="../js/pages/settings-page.js"></script>
</body>
</html>
