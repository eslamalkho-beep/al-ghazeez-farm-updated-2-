<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جرد مخزون | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .sc-line {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: var(--spacing-3);
      margin-bottom: var(--spacing-3);
      background: var(--color-bg);
      position: relative;
    }
    .sc-line__remove {
      position: absolute; inset-inline-start: 10px; top: 10px;
      width: 28px; height: 28px; border-radius: var(--radius-sm);
      border: 1px solid var(--color-border); background: var(--color-surface);
      color: var(--color-primary-red); font-weight: 800; cursor: pointer;
    }
    .sc-line__row { display: flex; gap: var(--spacing-3); flex-wrap: wrap; align-items: end; margin-bottom: var(--spacing-2); }
    .sc-line__field { min-width: 180px; flex: 1; }
    .sc-line__field label { display:block; font-size:11.5px; font-weight:700; color: var(--color-text-secondary); margin-bottom:4px; }
    .sc-line__preview { font-size: 12.5px; color: var(--color-text-secondary); background: var(--color-surface); border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: var(--spacing-2); }
    .sc-line__result { font-size: 14px; font-weight: 800; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--color-surface); }
    .sc-status-banner {
      padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; margin-bottom: var(--spacing-3);
    }
    .sc-status-banner--approved { background: rgba(30,158,90,0.1); color: var(--color-primary-green-dark); }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2 id="form-title">جرد جديد</h2>
          <a href="stock-counts.html" class="btn btn--outline">→ العودة للجرد</a>
        </div>

        <div class="card">
          <div id="status-banner"></div>

          <form id="count-form" class="form-grid" novalidate onsubmit="return false;">
            <div class="form-group">
              <label for="date">تاريخ الجرد <span class="required">*</span></label>
              <input type="date" id="date" class="form-control" />
              <span class="form-error">التاريخ مطلوب</span>
            </div>
            <div class="form-group form-group--full">
              <label for="notes">ملاحظات</label>
              <input type="text" id="notes" class="form-control" />
            </div>
          </form>

          <div style="margin: var(--spacing-4) 0 var(--spacing-2); font-weight:800; font-size:15px;">سطور الجرد</div>
          <div id="lines-list"></div>
          <button type="button" class="btn btn--outline btn--sm" id="add-line-btn">+ إضافة صنف</button>

          <div class="form-actions">
            <button type="button" class="btn btn--outline" id="save-draft-btn">حفظ كمسودة</button>
            <button type="button" class="btn btn--success" id="approve-btn">اعتماد الجرد</button>
            <button type="button" class="btn btn--outline" id="unapprove-btn" style="display:none;">إلغاء الاعتماد</button>
            <a href="stock-counts.html" class="btn btn--outline">إلغاء</a>
            <button type="button" class="btn btn--danger" id="delete-btn" style="display:none; margin-right:auto;">حذف</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
<script src="../js/services/account-mapping-service.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/inventory-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/services/stock-count-service.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/pages/stock-count-form-page.js"></script>
</body>
</html>
