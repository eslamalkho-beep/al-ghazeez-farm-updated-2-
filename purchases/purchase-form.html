<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تكويد مشترى | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2 id="form-title">تكويد مشترى جديد</h2>
          <a href="purchase-list.html" class="btn btn--outline">→ العودة للسجل</a>
        </div>
        <div class="card">
          <form id="purchase-form" class="form-grid" novalidate>
            <div class="form-group">
              <label for="category">نوع المشترى <span class="required">*</span></label>
              <select id="category" class="form-control"></select>
            </div>
            <div class="form-group">
              <label for="amount">المبلغ <span class="required">*</span></label>
              <input type="number" id="amount" class="form-control" min="0" step="0.01" />
              <span class="form-error">أدخل مبلغًا صحيحًا</span>
            </div>
            <div class="form-group">
              <label for="date">التاريخ <span class="required">*</span></label>
              <input type="date" id="date" class="form-control" />
              <span class="form-error">التاريخ مطلوب</span>
            </div>
            <div class="form-group">
              <label for="hasTaxInvoice">فاتورة ضريبية؟</label>
              <select id="hasTaxInvoice" class="form-control">
                <option value="no">لا</option>
                <option value="yes">نعم</option>
              </select>
            </div>
            <div class="form-group form-group--full" id="tax-breakdown-group" style="display:none;">
              <label>تفاصيل الضريبة (15%)</label>
              <div class="tax-breakdown-box">
                <span>المبلغ قبل الضريبة: <strong id="tax-before-label">-</strong></span>
                <span>قيمة الضريبة: <strong id="tax-value-label">-</strong></span>
              </div>
            </div>
            <div class="form-group">
              <label for="paymentMethod">طريقة الدفع</label>
              <select id="paymentMethod" class="form-control">
                <option value="cash">نقدي</option>
                <option value="transfer">تحويل بنكي</option>
                <option value="cheque">شيك</option>
              </select>
            </div>
            <div class="form-group">
              <label for="partyId">المورّد</label>
              <select id="partyId" class="form-control"></select>
            </div>
            <div class="form-group" id="vendor-manual-group">
              <label for="vendor">أو أدخل اسم مورّد غير مسجّل</label>
              <input type="text" id="vendor" class="form-control" placeholder="اسم حر (اختياري)" />
            </div>
            <div class="form-group">
              <label for="status">الحالة</label>
              <select id="status" class="form-control">
                <option value="approved">معتمد</option>
                <option value="pending">قيد الاعتماد</option>
              </select>
            </div>
            <div class="form-group form-group--full">
              <label for="notes">ملاحظات</label>
              <textarea id="notes" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--success" id="save-btn">حفظ</button>
              <a href="purchase-list.html" class="btn btn--outline">إلغاء</a>
              <button type="button" class="btn btn--danger" id="delete-btn" style="display:none; margin-right:auto;">حذف</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/notification-service.js"></script>
  <script src="../js/services/purchase-service.js"></script>
  <script src="../js/services/category-service.js"></script>
  <script src="../js/services/party-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/pages/purchase-form-page.js"></script>
</body>
</html>
