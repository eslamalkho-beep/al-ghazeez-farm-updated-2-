<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تشغيل إهلاك الفترة | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>تشغيل إهلاك الفترة</h2>
          <a href="assets-hub.html" class="btn btn--outline">→ العودة للمدخل</a>
        </div>

        <div class="card" style="margin-bottom: var(--spacing-4);">
          <div class="card__header"><h3>اختيار الشهر</h3></div>
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding: 0 var(--spacing-3) var(--spacing-3);">
            <input type="month" id="period-input" class="form-control" style="max-width:220px;" />
            <button type="button" class="btn btn--outline" id="preview-btn">معاينة</button>
            <button type="button" class="btn btn--success" id="run-btn" style="display:none;">ترحيل الإهلاك</button>
          </div>
          <p style="font-size:12px; color: var(--color-text-secondary); padding: 0 var(--spacing-3) var(--spacing-3);">
            بما أن التطبيق يعمل بلا خادم، لا يمكن ترحيل الإهلاك تلقائيًا كل شهر — يجب تشغيل هذه الصفحة يدويًا لكل فترة.
            الأصول التي سبق ترحيل إهلاكها لنفس الشهر تُستبعد تلقائيًا من المعاينة (لا ترحيل مزدوج).
          </p>
        </div>

        <div class="card" id="preview-card" style="display:none; margin-bottom: var(--spacing-4);">
          <div class="card__header"><h3>معاينة الإهلاك المستحق</h3></div>
          <div id="preview-table"></div>
        </div>

        <div class="card">
          <div class="card__header"><h3>سجل عمليات الإهلاك السابقة</h3></div>
          <div id="history-table"></div>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
<script src="../js/services/account-mapping-service.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/services/fixed-asset-service.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="../js/pages/asset-depreciation-run-page.js"></script>
</body>
</html>
