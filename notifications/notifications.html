<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الإشعارات | مزرعة الغزيز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-3);
      padding: var(--spacing-3);
      border-bottom: 1px solid var(--color-border);
    }
    .notif-item:last-child { border-bottom: none; }
    .notif-item.unread { background: rgba(30,95,191,0.04); }
    .notif-icon {
      width: 40px; height: 40px; border-radius: 50%;
      display:flex; align-items:center; justify-content:center;
      background: rgba(30,95,191,0.1); color: var(--color-primary-blue);
      flex-shrink: 0; font-size: 18px;
    }
    .notif-title { font-weight: 700; font-size: 14px; }
    .notif-message { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
    .notif-time { font-size: 11px; color: var(--color-text-secondary); margin-top: 4px; }
    .notif-actions { margin-right: auto; display:flex; gap:8px; }
  </style>
</head>
<body>

  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>مركز الإشعارات</h2>
          <button class="btn btn--outline" id="mark-all-read-btn">تحديد الكل كمقروء</button>
        </div>
        <div class="card" style="padding:0;">
          <div id="notif-list"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/notification-service.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/pages/notifications-page.js"></script>
</body>
</html>
