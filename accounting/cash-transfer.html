<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحويل صندوق ↔ بنك | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>تحويل صندوق ↔ بنك</h2>
        </div>

        

        <div class="card" id="transfer-form-card" style="margin-bottom: var(--spacing-4);">
          <div class="card__header"><h3>تحويل جديد</h3></div>

          <form id="transfer-form" class="form-grid" novalidate>
            <div class="form-group">
              <label for="direction">الاتجاه <span class="required">*</span></label>
              <select id="direction" class="form-control">
                <option value="cashToBank">من الصندوق إلى البنك</option>
                <option value="bankToCash">من البنك إلى الصندوق</option>
              </select>
            </div>

            <div class="form-group">
              <label for="date">التاريخ <span class="required">*</span></label>
              <input type="date" id="date" class="form-control" />
              <span class="form-error">التاريخ مطلوب</span>
            </div>

            <div class="form-group">
              <label for="amount">المبلغ <span class="required">*</span></label>
              <input type="number" id="amount" class="form-control" min="0" step="0.01" />
              <span class="form-error">أدخل مبلغًا صحيحًا</span>
            </div>

            <div class="form-group form-group--full">
              <label for="notes">ملاحظات</label>
              <input type="text" id="notes" class="form-control" />
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--success" id="save-transfer-btn">تنفيذ التحويل</button>
            </div>
          </form>
        </div>

        <div class="card__header" style="padding: 0 4px;"><h3>سجل التحويلات</h3></div>
        <div id="transfer-table"></div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
<script src="../js/services/account-mapping-service.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/services/period-service.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="../js/pages/cash-transfer-page.js"></script>
</body>
</html>
