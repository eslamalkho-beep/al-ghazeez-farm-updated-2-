<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بطاقة الأصل الثابت | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>بطاقة الأصل الثابت</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <a href="asset-list.html" class="btn btn--outline">→ العودة للسجل</a>
            <button type="button" class="btn btn--outline" id="attachments-btn">📎 مرفقات</button>
            <a href="#" id="edit-link" class="btn btn--outline">تعديل</a>
            <button type="button" class="btn btn--danger" id="delete-btn">حذف</button>
          </div>
        </div>

        <div id="card-box">
          <div class="card" style="margin-bottom: var(--spacing-4);">
            <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
              <div>
                <h2 id="asset-name" style="margin:0;"></h2>
                <div style="color: var(--color-text-secondary); font-size:13px;" id="asset-meta"></div>
              </div>
            </div>
            <div class="kpi-grid" id="asset-kpis" style="margin-top: var(--spacing-4);"></div>
          </div>

          <div class="card" style="margin-bottom: var(--spacing-4);">
            <div class="card__header"><h3>بيانات الأصل</h3></div>
            <div id="asset-details"></div>
          </div>

          <div class="card" id="asset-operations-card" style="margin-bottom: var(--spacing-4);">
            <div class="card__header"><h3>عمليات</h3></div>
            <div class="kpi-grid" id="asset-operations-grid" style="grid-template-columns: repeat(4, 1fr);"></div>
          </div>

          <div class="card" id="sale-disposal-info-card" style="display:none; margin-bottom: var(--spacing-4); border-right: 3px solid var(--color-primary-blue);">
            <div id="sale-disposal-info"></div>
          </div>

          <div class="card">
            <div class="card__header"><h3>السجل الزمني</h3></div>
            <div id="asset-timeline"></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
<script src="../js/services/account-mapping-service.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/services/fixed-asset-service.js"></script>
  <script src="../js/services/location-service.js"></script>
  <script src="../js/services/attachment-service.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/kpi-bar.js"></script>
  <script src="../js/components/attachment-manager.js"></script>
  <script src="../js/pages/asset-card-page.js"></script>
</body>
</html>
