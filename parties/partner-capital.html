<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ضخ/سحب فلوس الشريك | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>ضخ/سحب فلوس (جاري الشريك)</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn btn--outline" id="export-excel-btn">تصدير Excel</button>
            <button type="button" class="btn btn--outline" id="export-pdf-btn">تصدير PDF</button>
            <a href="parties-hub.html" class="btn btn--outline">→ العملاء والموردون</a>
          </div>
        </div>

        <div class="card" style="margin-bottom: var(--spacing-4);">
          <div class="card__header"><h3>حركة جديدة على جاري الشريك</h3></div>

          <form id="capital-form" class="form-grid" novalidate>
            <div class="form-group">
              <label>رقم المرجع</label>
              <input type="text" id="voucherNumberPreview" class="form-control" value="سيُولَّد تلقائيًا عند الحفظ" disabled />
            </div>

            <div class="form-group">
              <label for="type">نوع العملية <span class="required">*</span></label>
              <select id="type" class="form-control">
                <option value="capitalIn">ضخ فلوس (مساهمة من الشريك)</option>
                <option value="capitalOut">سحب فلوس (سحب بواسطة الشريك)</option>
              </select>
            </div>

            <div class="form-group">
              <label for="date">التاريخ <span class="required">*</span></label>
              <input type="date" id="date" class="form-control" />
              <span class="form-error">التاريخ مطلوب</span>
            </div>

            <div class="form-group">
              <label for="partyId">الشريك <span class="required">*</span></label>
              <select id="partyId" class="form-control"></select>
              <span class="form-error">يرجى اختيار الشريك</span>
              <small id="party-balance-hint" style="color:var(--color-text-secondary);"></small>
            </div>

            <div class="form-group">
              <label for="method">الطريقة <span class="required">*</span></label>
              <select id="method" class="form-control">
                <option value="cash">نقد</option>
                <option value="bank">بنك</option>
                <option value="transfer">تحويل</option>
                <option value="network">شبكة</option>
              </select>
            </div>

            <div class="form-group">
              <label for="amount">المبلغ <span class="required">*</span></label>
              <input type="number" id="amount" class="form-control" min="0.01" step="0.01" />
              <span class="form-error">أدخل مبلغًا صحيحًا</span>
            </div>

            <div class="form-group form-group--full">
              <label for="description">البيان</label>
              <textarea id="description" class="form-control" rows="2"></textarea>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--success" id="save-btn">حفظ الحركة</button>
            </div>
          </form>
        </div>

        <div class="card__header" style="padding: 0 4px;"><h3>حركات جاري الشريك السابقة</h3></div>
        <div id="capital-table"></div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="../js/db/db.js"></script>
<script src="../js/services/account-mapping-service.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/services/revenue-service.js"></script>
  <script src="../js/services/purchase-service.js"></script>
  <script src="../js/services/fixed-asset-service.js"></script>
  <script src="../js/services/party-service.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="../js/components/export-utils.js"></script>
  <script src="../js/pages/partner-capital-page.js"></script>
</body>
</html>
