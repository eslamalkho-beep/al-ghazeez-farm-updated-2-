<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بيع أصل ثابت | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>💰 بيع الأصل</h2>
          <a href="#" id="back-link" class="btn btn--outline">→ العودة لبطاقة الأصل</a>
        </div>
        <div class="card" style="margin-bottom: var(--spacing-3);">
          <strong id="asset-label"></strong>
          <div class="kpi-grid" id="asset-kpis" style="margin-top: var(--spacing-3);"></div>
        </div>
        <div class="card">
          <form id="sale-form" class="form-grid" novalidate>
            <div class="form-group">
              <label for="date">تاريخ البيع <span class="required">*</span></label>
              <input type="date" id="date" class="form-control" />
              <span class="form-error">التاريخ مطلوب</span>
            </div>
            <div class="form-group">
              <label for="salePrice">سعر البيع <span class="required">*</span></label>
              <input type="number" id="salePrice" class="form-control" min="0" step="0.01" />
              <span class="form-error">أدخل سعرًا صحيحًا</span>
            </div>
            <div class="form-group form-group--full">
              <label>الربح أو الخسارة المتوقّعة (محسوبة)</label>
              <div class="tax-breakdown-box"><strong id="gain-loss-label">-</strong></div>
            </div>
            <div class="form-group">
              <label for="paymentMethod">طريقة الاستلام</label>
              <select id="paymentMethod" class="form-control">
                <option value="cash">نقدي</option>
                <option value="transfer">تحويل بنكي</option>
                <option value="cheque">شيك</option>
                <option value="credit">آجل (على الحساب)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="partyId">العميل المسجّل</label>
              <select id="partyId" class="form-control"><option value="">-- اختر عميلاً مسجّلاً --</option></select>
            </div>
            <div class="form-group" id="buyer-manual-group">
              <label for="buyerName">أو أدخل اسم مشترٍ غير مسجّل</label>
              <input type="text" id="buyerName" class="form-control" placeholder="اسم حر (اختياري)" />
            </div>
            <div class="form-group form-group--full">
              <label for="notes">ملاحظات</label>
              <textarea id="notes" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--success" id="save-btn">تنفيذ البيع</button>
              <a href="#" id="cancel-link" class="btn btn--outline">إلغاء</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
<script src="../js/services/account-mapping-service.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/services/fixed-asset-service.js"></script>
  <script src="../js/services/party-service.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/kpi-bar.js"></script>
  <script src="../js/pages/asset-sale-page.js"></script>
</body>
</html>
