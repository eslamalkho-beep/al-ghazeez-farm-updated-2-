<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قفل الفترات المحاسبية | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>قفل الفترات المحاسبية</h2>
        </div>
        <p style="color: var(--color-text-secondary); font-size: 13px; margin-top: calc(-1 * var(--spacing-2)); margin-bottom: var(--spacing-3);">
          إغلاق شهر يمنع إضافة أو تعديل أو حذف أي مصروف/إيراد/مشترى/قيد يومية/تحويل صندوق↔بنك بتاريخ ضمنه، إلا لمدير النظام. أي شهر غير مذكور في الجدول أدناه يُعتبر مفتوحًا تلقائيًا.
        </p>

        

        <div class="card" id="close-period-card" style="margin-bottom: var(--spacing-4);">
          <div class="card__header"><h3>إغلاق فترة جديدة</h3></div>
          <form id="close-period-form" class="form-grid" novalidate>
            <div class="form-group">
              <label for="periodMonth">الشهر <span class="required">*</span></label>
              <input type="month" id="periodMonth" class="form-control" />
              <span class="form-error">اختر شهرًا</span>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--danger" id="close-period-btn">إغلاق الفترة</button>
            </div>
          </form>
        </div>

        <div class="card" id="admin-only-note" style="display:none; margin-bottom: var(--spacing-4);">
          <p style="color: var(--color-text-secondary); font-size: 13px; margin:0;">إغلاق/فتح الفترات المحاسبية مقصور على مدير النظام.</p>
        </div>

        <div class="card__header" style="padding: 0 4px;"><h3>سجل الفترات</h3></div>
        <div id="periods-table"></div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/period-service.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/data-table.js"></script>
  <script src="../js/pages/period-lock-page.js"></script>
</body>
</html>
