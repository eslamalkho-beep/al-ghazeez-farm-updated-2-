<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محفظة عهد الموظف | مزرعة الغزيز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main-area">
      <div id="header-container"></div>
      <main class="page-content">
        <div class="page-header">
          <h2>محفظة عهد الموظف</h2>
          <a href="custody-hub.html" class="btn btn--outline">→ العودة</a>
        </div>

        <div id="picker-box" class="card" style="margin-bottom: var(--spacing-4);">
          <div class="card__header"><h3>اختر موظفًا</h3></div>
          <div id="employee-picker-grid" class="kpi-grid"></div>
        </div>

        <div id="wallet-box" style="display:none;">
          <div class="card" style="margin-bottom: var(--spacing-4);">
            <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
              <div id="wallet-avatar"></div>
              <div style="flex:1; min-width:200px;">
                <div style="display:flex; align-items:center; gap:8px;">
                  <h2 id="wallet-name" style="margin:0;"></h2>
                  <span id="wallet-indicator" style="font-size:22px;"></span>
                </div>
                <div style="color: var(--color-text-secondary); font-size:13px;" id="wallet-meta"></div>
              </div>
            </div>
            <div class="kpi-grid" id="wallet-kpis" style="margin-top: var(--spacing-4);"></div>
          </div>

          <div class="card">
            <div class="card__header"><h3>السجل الزمني للحركات</h3></div>
            <div id="wallet-timeline"></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>

  <script src="../js/db/db.js"></script>
<script src="../js/services/account-mapping-service.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/accounting-service.js"></script>
  <script src="../js/services/inventory-service.js"></script>
  <script src="../js/services/custody-service.js"></script>
  <script src="../js/services/attachment-service.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/quick-action-fab.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/kpi-bar.js"></script>
  <script src="../js/components/attachment-manager.js"></script>
  <script src="../js/pages/employee-wallet-page.js"></script>
</body>
</html>
